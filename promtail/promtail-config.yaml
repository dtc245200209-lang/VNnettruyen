# ==========================================
# Promtail Configuration for VNnettruyen
# ==========================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 1. Thu thập Log từ Nginx Reverse Proxy
  - job_name: nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          env: production
          __path__: /var/log/nginx/*.log

  # 2. Thu thập Log từ Node.js Web Application
  - job_name: webapp
    static_configs:
      - targets:
          - localhost
        labels:
          job: webapp
          env: production
          __path__: /var/log/app/*.log
